<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MountX Full-Stack Task Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(20, 26, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.12);
      --accent: #6366f1;
      --accent-grad: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
      --accent-glow: rgba(99, 102, 241, 0.25);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(217, 70, 239, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 860px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 36px;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #818cf8;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
    }

    .badge-pill .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    h1 {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 16px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .stat-card:hover {
      border-color: var(--card-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .stat-value {
      font-size: 32px;
      font-weight: 800;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Main Card */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      margin-bottom: 28px;
    }

    /* Add Task Form */
    .task-form {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .input-group {
      flex: 1;
      min-width: 260px;
    }

    input[type="text"] {
      width: 100%;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 18px;
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    select {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 18px;
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }

    button.btn-primary {
      background: var(--accent-grad);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 14px 26px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
    }

    button.btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    button.btn-primary:active {
      transform: translateY(0);
    }

    /* Filter Tabs */
    .filter-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 14px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    /* Task Items */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .task-item:hover {
      background: rgba(15, 23, 42, 0.7);
      border-color: var(--card-hover);
      transform: translateX(4px);
    }

    .task-item.done {
      opacity: 0.6;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
    }

    .check-btn {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      border: 2px solid var(--text-muted);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .task-item.done .check-btn {
      background: var(--success);
      border-color: var(--success);
    }

    .check-btn svg {
      display: none;
    }

    .task-item.done .check-btn svg {
      display: block;
    }

    .task-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .task-title {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      transition: all 0.2s;
    }

    .task-item.done .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .category-badge {
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .category-MountX { background: rgba(99, 102, 241, 0.2); color: #818cf8; }
    .category-Work { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .category-Personal { background: rgba(16, 185, 129, 0.2); color: #34d399; }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .delete-btn:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-state svg {
      margin-bottom: 12px;
      opacity: 0.4;
    }

    /* Footer */
    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 20px;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge-pill">
        <span class="pulse-dot"></span>
        MOUNTX NATIVE SUBSTRATE (AOT) • HTTP & SQLite ORM
      </div>
      <h1>MountX Task Studio</h1>
      <p class="subtitle">Full-Stack Web Application written in 100% Native MountX</p>
    </header>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">Total Tasks</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-pending" style="color: #fbbf24;">0</div>
        <div class="stat-label">Pending</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-completed" style="color: #34d399;">0</div>
        <div class="stat-label">Completed</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-latency" style="color: #818cf8;">&lt;1 ms</div>
        <div class="stat-label">API Latency</div>
      </div>
    </div>

    <!-- Main Card -->
    <div class="glass-card">
      <form class="task-form" id="task-form">
        <div class="input-group">
          <input type="text" id="task-title" placeholder="What needs to be done in MountX?" required autocomplete="off">
        </div>
        <select id="task-category">
          <option value="MountX">MountX Core</option>
          <option value="Work">Work</option>
          <option value="Personal">Personal</option>
        </select>
        <button type="submit" class="btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Add Task
        </button>
      </form>

      <!-- Filter Tabs -->
      <div class="filter-tabs">
        <button class="tab-btn active" data-filter="all">All</button>
        <button class="tab-btn" data-filter="active">Active</button>
        <button class="tab-btn" data-filter="completed">Completed</button>
      </div>

      <!-- Task List Container -->
      <div class="task-list" id="task-list">
        <div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          <p>Loading tasks from SQLite database...</p>
        </div>
      </div>
    </div>

    <footer>
      MountX 1.1 • Full-Stack Framework Showcase • Built with <span style="color:#ef4444;">♥</span> in MountX
    </footer>
  </div>

  <script>
    let currentTasks = [];
    let activeFilter = 'all';

    async function fetchTasks() {
      const t0 = performance.now();
      try {
        const res = await fetch('/api/tasks');
        const tasks = await res.json();
        const t1 = performance.now();
        document.getElementById('stat-latency').innerText = Math.max(1, Math.round(t1 - t0)) + ' ms';
        currentTasks = tasks;
        renderTasks();
        updateStats();
      } catch (err) {
        console.error("Failed to fetch tasks:", err);
      }
    }

    function renderTasks() {
      const listEl = document.getElementById('task-list');
      let filtered = currentTasks;
      if (activeFilter === 'active') filtered = currentTasks.filter(t => t.done === 0);
      if (activeFilter === 'completed') filtered = currentTasks.filter(t => t.done === 1);

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            <p>No tasks found in this view. Add one above!</p>
          </div>
        `;
        return;
      }

      listEl.innerHTML = filtered.map(t => `
        <div class="task-item ${t.done ? 'done' : ''}" data-id="${t.id}">
          <div class="task-left">
            <button class="check-btn" onclick="toggleTask(${t.id})">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </button>
            <div class="task-content">
              <div class="task-title">${escapeHtml(t.title)}</div>
              <div class="task-meta">
                <span class="category-badge category-${t.category || 'MountX'}">${t.category || 'General'}</span>
                <span>#${t.id}</span>
              </div>
            </div>
          </div>
          <button class="delete-btn" onclick="deleteTask(${t.id})" title="Delete task">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          </button>
        </div>
      `).join('');
    }

    function updateStats() {
      const total = currentTasks.length;
      const completed = currentTasks.filter(t => t.done === 1).length;
      const pending = total - completed;
      document.getElementById('stat-total').innerText = total;
      document.getElementById('stat-completed').innerText = completed;
      document.getElementById('stat-pending').innerText = pending;
    }

    async function addTask(e) {
      e.preventDefault();
      const titleInput = document.getElementById('task-title');
      const catInput = document.getElementById('task-category');
      const title = titleInput.value.trim();
      if (!title) return;

      const payload = { title: title, category: catInput.value, done: 0 };
      await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      titleInput.value = '';
      await fetchTasks();
    }

    async function toggleTask(id) {
      await fetch('/api/tasks/toggle/' + id, { method: 'POST' });
      await fetchTasks();
    }

    async function deleteTask(id) {
      await fetch('/api/tasks/delete/' + id, { method: 'POST' });
      await fetchTasks();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    document.getElementById('task-form').addEventListener('submit', addTask);

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        activeFilter = e.target.dataset.filter;
        renderTasks();
      });
    });

    fetchTasks();
  </script>
</body>
</html>
